<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#232323">
<title>Flash Professional CS6 Mobile — Ported by AlexCoder</title>
<style>
:root{color-scheme:dark;--bg:#232323;--panel:#2f2f2f;--panel2:#3a3a3a;--line:#151515;--text:#e6e6e6;--muted:#9a9a9a;--blue:#126fa9;--sel:#18a0fb}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:12px/1.3 "Segoe UI",Arial,Helvetica,sans-serif;-webkit-user-select:none;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:#454545;border:1px solid #1a1a1a;border-radius:3px;padding:4px 8px;cursor:pointer}
button:hover{background:#525252}button:active,button.on{background:var(--blue)!important}button:disabled{opacity:.4}
input[type=text],input[type=number],textarea,select{background:#1b1b1b;border:1px solid #4a4a4a;border-radius:2px;padding:3px 5px;min-width:0;-webkit-user-select:text;user-select:text}
input[type=color]{padding:0;border:1px solid #111;background:none;width:100%;height:22px}
input[type=number]{width:100%}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) 6px var(--tlh,230px) 22px}
/* top */
.top{background:#1c1c1c;border-bottom:1px solid #000;position:relative;z-index:40}
.brand{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:linear-gradient(#3b3b3b,#262626);font-weight:700}
.brand small{font-weight:400;color:#bbb}
#menubar{display:flex;border-top:1px solid #444}
.menu-wrap{position:relative}
.menu{background:transparent;border:0;border-radius:0;padding:6px 12px}
.menu.open,.menu:hover{background:#444}
.dropdown{display:none;position:absolute;top:100%;left:0;min-width:250px;background:#303030;border:1px solid #000;box-shadow:0 6px 18px #000a;padding:3px}
.dropdown.show{display:block}
.dropdown button{display:flex;justify-content:space-between;gap:20px;width:100%;text-align:left;background:transparent;border:0;padding:6px 9px}
.dropdown button:hover{background:var(--blue)}
.dropdown button span{color:#999}
.dropdown hr{border:0;border-top:1px solid #4a4a4a;margin:3px 0}
/* work */
.work{display:grid;grid-template-columns:50px minmax(0,1fr) 292px;min-height:0}
.toolbar{background:var(--panel);border-right:1px solid #000;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:min-content;gap:4px;padding:6px 4px;overflow:auto;align-content:start}
.tool{height:34px;padding:0;font-size:17px;background:#414141;display:grid;place-items:center}
.tool.active{background:var(--blue);outline:1px solid #69bfff}
.tb-sep{grid-column:1/3;height:1px;background:#555;margin:3px 0}
.tb-col{grid-column:1/3;display:flex;flex-direction:column;gap:2px;font-size:9px;color:var(--muted);text-align:center}
.center{display:flex;flex-direction:column;min-width:0;min-height:0}
.docbar{height:28px;flex:none;background:#383838;border-bottom:1px solid #151515;display:flex;align-items:center;padding:0 10px;gap:8px;color:#ccc}
.docbar .sp{flex:1}.docbar button{padding:2px 8px}
.docbar{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x}.docbar::-webkit-scrollbar{display:none}.docbar>*{flex:none;white-space:nowrap}
/* barra de menús (modo escritorio) deslizable; los menús se abren en fijo para no recortarse */
#menubar{overflow-x:auto;scrollbar-width:none}#menubar::-webkit-scrollbar{display:none}#menubar .menu{white-space:nowrap;flex:none}#menubar .dropdown{position:fixed;top:auto;left:auto}
.stage-area{flex:1;min-height:0;overflow:auto;background:#1b1b1b;position:relative}
.stage-inner{min-width:100%;min-height:100%;display:flex;padding:34px;box-sizing:border-box}
#stage{margin:auto;display:block;background:#fff;box-shadow:0 4px 22px #000b;touch-action:none;flex:none}
/* side */
.side{background:var(--panel);border-left:1px solid #000;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;background:#252525}.tabs button{flex:1;border-radius:0;border:0;border-bottom:2px solid transparent;background:transparent;padding:7px}
.tabs button.on{background:var(--panel)!important;border-bottom-color:var(--sel)}
.pane{flex:1;min-height:0;overflow:auto;padding:8px}
.pane h4{margin:6px 0 6px;font-size:11px;color:#bbb;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid #444;padding-bottom:3px}
.row{display:grid;grid-template-columns:92px 1fr;gap:6px;align-items:center;margin-bottom:5px}
.row label{color:#bbb}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.hint{color:var(--muted);font-size:11px;margin:6px 0}
.btns{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.liblist{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.lib-item{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:center;padding:3px;border:1px solid transparent;cursor:pointer}
.lib-item:hover{background:#3a3a3a}.lib-item.sel{background:#1b4f75;border-color:#3a9be0}
.lib-item canvas{width:36px;height:36px;background:repeating-conic-gradient(#555 0 25%,#444 0 50%) 0 0/10px 10px;border:1px solid #111}
.lib-item small{color:var(--muted);display:block}
.lib-item b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
/* timeline */
.splitter{background:#111;cursor:row-resize;touch-action:none}.splitter:hover{background:var(--blue)}
.timeline{position:relative;background:var(--panel);display:flex;flex-direction:column;min-height:0;border-top:1px solid #000}
.tl-head{display:flex;align-items:center;gap:5px;padding:3px 8px;background:#3a3a3a;border-bottom:1px solid #191919;flex:none;flex-wrap:wrap}
.tl-head button{padding:3px 8px}.tl-head .vs{width:1px;height:18px;background:#555;margin:0 3px}
.tl-head input[type=number]{width:52px}
.tl-body{flex:1;min-height:0;display:grid;grid-template-columns:200px minmax(0,1fr)}
.tl-layers{border-right:1px solid #111;display:flex;flex-direction:column;min-height:0;background:#303030}
.tl-corner{height:20px;flex:none;background:#444;color:#bbb;padding:2px 8px;font-size:11px;border-bottom:1px solid #111}
.tl-layers-clip{flex:1;overflow:hidden;min-height:0}
.lrow{height:24px;display:flex;align-items:center;gap:2px;padding:0 4px;border-bottom:1px solid #1f1f1f;background:#343434;cursor:pointer}
.lrow.sel{background:#4a5a66}.lrow.mask .ln:before{content:"◐ "}
.lrow.cam{background:#2c4638}.lrow.cam.sel{background:#3d6b52}
.lrow .ln{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{padding:0 3px;border:0;background:transparent;font-size:12px;line-height:22px}
.tl-view{position:relative;min-width:0;min-height:0;background:#2a2a2a}
#tlCanvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#tlScroll{position:absolute;inset:0;overflow:auto}
.lrow.snd{background:#3a3560}
.status{background:#1c1c1c;color:#aaa;font-size:11px;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
#toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:#000d;color:#fff;padding:8px 14px;border:1px solid #666;border-radius:4px;display:none;z-index:200;max-width:calc(var(--aw,100vw)*.8)}
.modal-bg{position:fixed;inset:0;background:#000a;z-index:150;display:flex;align-items:center;justify-content:center}
.modal{background:#2d2d2d;border:1px solid #000;border-radius:6px;padding:16px 18px;min-width:340px;max-width:min(620px,calc(var(--aw,100vw)*.92));max-height:calc(var(--ah,100vh)*.86);overflow:auto;box-shadow:0 10px 40px #000}
.modal h3{margin:0 0 10px}.modal p,.modal li{margin:4px 0;line-height:1.45;-webkit-user-select:text;user-select:text}
.modal table{border-collapse:collapse;width:100%}.modal td{padding:2px 8px 2px 0;border-bottom:1px solid #3d3d3d}
kbd{background:#1b1b1b;border:1px solid #555;border-radius:3px;padding:0 4px;font-size:11px}
#rot{display:none;position:fixed;top:0;left:0;right:0;background:#c47a00;color:#000;padding:5px;text-align:center;z-index:300;font-weight:700}

.drop{outline:3px dashed var(--sel);outline-offset:-8px}
.tool[data-tool=bone],.tool[data-tool=pose]{font-size:16px}
#varPanel{position:fixed;z-index:60;width:300px;max-height:calc(var(--ah,100vh)*.6);display:flex;flex-direction:column;background:#2b2b2b;border:1px solid #17c3b2;border-radius:6px;box-shadow:0 8px 28px rgba(0,0,0,.6);padding:8px;gap:6px;color:#ddd;font-size:12px}
#varPanel .vp-h{display:flex;justify-content:space-between;align-items:center;gap:6px}#varPanel .vp-h b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#varPanel button{background:#414141;border:1px solid #555;color:#ddd;border-radius:4px;padding:3px 7px;cursor:pointer}#varPanel button.on{background:#17c3b2;color:#06302c;border-color:#17c3b2}
#varPanel .vp-m{display:flex;gap:4px}#varPanel input{background:#1c1c1c;border:1px solid #555;color:#ddd;padding:4px 6px;border-radius:4px}
#vpG{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;overflow:auto;min-height:60px}
.vitem{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px;border:1px solid transparent;border-radius:4px;cursor:pointer;min-width:0}
.vitem:hover{background:#3a3a3a}.vitem.cur{border-color:#17c3b2;background:#1d4743}
.vitem canvas{width:56px;height:56px;background:repeating-conic-gradient(#555 0 25%,#444 0 50%) 0 0/10px 10px;border:1px solid #111}
.vitem span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;color:#aaa}

/* ---- horizontal fijo (diseño de laptop aunque el teléfono esté en vertical) ---- */
html.vland body{position:fixed;left:0;top:0;width:var(--W);height:var(--H);transform-origin:0 0;transform:translateX(var(--SW)) rotate(90deg)}
#hamb,#bSide{display:none}
#mega{position:fixed;left:0;top:0;bottom:0;width:min(300px,75%);z-index:120;background:#2b2b2b;border-right:1px solid #000;box-shadow:6px 0 24px #000a;overflow:auto;padding:6px;display:none}
#mega.show{display:block}#megaBg{position:fixed;inset:0;z-index:119;background:#0007;display:none}#megaBg.show{display:block}
#mega summary{padding:10px 8px;font-weight:700;border-bottom:1px solid #444;cursor:pointer}
#mega button{display:flex;justify-content:space-between;width:100%;text-align:left;background:transparent;border:0;padding:10px 12px;font-size:13px}
#mega button span{color:#999}#mega hr{border:0;border-top:1px solid #444;margin:2px 0}
html.compact .top,html.compact .status{display:none}
html.compact #app{grid-template-rows:minmax(0,1fr) 10px var(--tlh,clamp(100px,30%,150px))}
html.compact #hamb,html.compact #bSide{display:inline-block}
html.compact .docbar{height:36px;gap:6px;padding:0 6px}html.compact .docbar button{padding:4px 9px;font-size:13px}
html.compact #coords,html.compact [data-act=z100]{display:none}
html.compact .work{grid-template-columns:48px minmax(0,1fr);position:relative}
html.compact .toolbar{grid-template-columns:1fr;gap:3px;padding:4px 3px}
html.compact .tool{height:38px}html.compact .tb-sep,html.compact .tb-col{grid-column:1/2}
html.compact .side{position:absolute;right:0;top:0;bottom:0;width:min(320px,62%);z-index:35;transform:translateX(102%);transition:transform .18s;box-shadow:-6px 0 20px #000a}
html.compact .side.open{transform:none}
html.compact .stage-inner{padding:14px}
html.compact .tl-head{flex-wrap:nowrap;overflow-x:auto;padding:3px 6px}html.compact .tl-head button{padding:4px 8px;flex:none;white-space:nowrap}
html.compact .tl-head>span{flex:none;white-space:nowrap}
.tl-head .ctl{display:flex;align-items:center;gap:5px}html.compact .tl-head .ctl{order:-1;padding-right:6px;margin-right:2px;border-right:1px solid #555}
html.compact .tl-body{grid-template-columns:120px minmax(0,1fr)}
html.compact .splitter{height:10px}
#symBar{display:none;align-items:center;gap:6px;background:#17c3b2;color:#06302c;border-radius:4px;padding:2px 4px 2px 8px;font-weight:700;font-size:12px;white-space:nowrap}
#symBar button{background:#06302c;color:#fff;border:0;border-radius:3px;padding:3px 8px;cursor:pointer}
body.symedit #symBar{display:flex}body.symedit .docbar{box-shadow:inset 0 -3px 0 #17c3b2}
#cpStroke,#cpFill{display:inline-flex;align-items:center;gap:4px}
#cpStroke i,#cpFill i{display:inline-block;width:14px;height:14px;border:1px solid #888;border-radius:3px}
#pal{position:fixed;z-index:130;width:232px;background:#2b2b2b;border:1px solid #666;border-radius:6px;padding:8px;box-shadow:0 8px 24px #000a;color:#ddd;font-size:12px}
#pal .pt{font-weight:700;margin-bottom:6px}#pal .pg{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
#pal .pg button{height:24px;border:1px solid #111;border-radius:3px;cursor:pointer;padding:0}#pal .pc{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.lrow.mask .ln{color:#17c3b2}
</style>
</head>
<body>
<div id="app">
 <header class="top">
  <div class="brand"><span>◈ Flash Professional CS6 Mobile</span><small>ported by AlexCoder</small></div>
  <nav id="menubar"></nav>
 </header>
 <div class="work">
  <aside class="toolbar" id="toolbar"></aside>
  <main class="center">
   <div class="docbar"><button id="hamb" data-act="hamb" title="Menú">☰</button><span id="symBar"><span id="symName">Símbolo</span><button data-act="symexit">‹ Salir del símbolo</button></span><b id="docName">Sin título-1</b><span class="sp"></span>
    <button id="cpStroke" data-act="palstroke" title="Color de lápiz / trazo">✎<i id="swS"></i></button><button id="cpFill" data-act="palfill" title="Color de relleno">◧<i id="swF"></i></button><button id="bSide" data-act="side" title="Propiedades / Biblioteca">▤ Paneles</button><button data-act="camview" id="bCamView" title="Ver la animación a través de la cámara">🎥 Vista cámara</button><span id="coords" style="color:#8aa">x: – y: –</span>
    <button data-act="zout">−</button><span id="zoomLbl" style="min-width:42px;text-align:center">100%</span><button data-act="zin">＋</button><button data-act="fit">Ajustar</button><button data-act="z100">100%</button>
   </div>
   <section class="stage-area" id="stageArea"><div class="stage-inner"><canvas id="stage"></canvas></div></section>
  </main>
  <aside class="side">
   <div class="tabs"><button class="on" data-tab="props">Propiedades</button><button data-tab="lib">Biblioteca</button></div>
   <div class="pane" id="paneProps"></div>
   <div class="pane" id="paneLib" hidden>
    <div class="btns"><button data-act="import">⇪ Importar…</button><button data-act="libplace">Colocar</button><button data-act="libdel">Eliminar</button></div>
    <div class="btns"><button id="bLibSwap" data-act="libswap" hidden title="Cambia el objeto seleccionado en el escenario por este símbolo, en todos los fotogramas">🔁 Cambiar símbolo</button><button id="bLibSwap1" data-act="libswap1" hidden title="Cambia el objeto seleccionado por este símbolo solo en el fotograma clave actual">🔁 Cambiar en este keyframe</button></div>
    <div class="btns"><button data-act="libdl" title="Descarga el elemento seleccionado como PNG">⬇ PNG</button><button data-act="libzip" title="ZIP con todas las imágenes de la biblioteca">⬇ ZIP imágenes</button><button data-act="libzipall" title="ZIP con imágenes + formas y clips renderizados">⬇ ZIP todo</button></div>
    <input id="libQ" type="text" placeholder="Buscar en la biblioteca…" style="width:100%">
    <div class="hint" id="libInfo"></div>
    <div class="liblist" id="libList"></div>
   </div>
  </aside>
 </div>
 <div class="splitter" id="splitter"></div>
 <section class="timeline" id="timeline">
  <div class="tl-head">
   <button data-act="addlayer">＋ Capa</button><button data-act="dellayer">🗑 Capa</button><button data-act="layerup" title="Subir capa">▲</button><button data-act="layerdown" title="Bajar capa">▼</button>
   <span class="vs"></span>
   <button data-act="f5" title="Insertar fotograma (F5)">＋ Fotograma</button><button data-act="f6" title="Fotograma clave (F6)">◆ Clave</button><button data-act="f7" title="Clave en blanco (F7)">◇ Blanco</button><button data-act="sf6" title="Quitar fotograma clave (Mayús+F6)">✕ Clave</button><button data-act="sf5" title="Quitar fotograma (Mayús+F5)">－ Fotograma</button><button data-act="tween" title="Interpolación de movimiento clásica">↔ Interpolar</button><button data-act="smooth" title="Tween fluido: interpolación con aceleración suave (ease in-out)">〰 Tween fluido</button>
   <span class="vs"></span>
   <span class="ctl"><button data-act="first">⏮</button><button data-act="prev">◀</button><button data-act="play" id="bPlay" style="min-width:34px">▶</button><button data-act="next">▶|</button>
   <span class="vs"></span>

   <span style="margin-left:auto;display:flex;align-items:center;gap:6px">FPS <input id="fps" type="number" min="1" max="120" value="24"> <label><input id="loop" type="checkbox" checked> bucle</label></span>
  </div>
  <div class="tl-body">
   <div class="tl-layers"><div class="tl-corner">Capas</div><div class="tl-layers-clip"><div id="layersInner"></div></div></div>
   <div class="tl-view" id="tlView"><canvas id="tlCanvas"></canvas><div id="tlScroll"><div id="tlSpacer"></div></div></div>
  </div>
 </section>
 <footer class="status"><span id="status">Herramienta: Selección</span><span id="frameStatus">Fotograma 1 / 24</span><span>Flash Mobile · AlexCoder</span></footer>
</div>
<input id="fileInput" type="file" style="display:none">

<script>
/*PARSER_START*/
// ====================== LECTOR SWF (sin DOM) ======================
class BR{
 constructor(u,p=0){this.u=u;this.p=p;this.bn=0;this.bb=0;this.dv=new DataView(u.buffer,u.byteOffset,u.byteLength)}
 align(){this.bn=0}
 u8(){this.bn=0;return this.u[this.p++]}
 u16(){this.bn=0;const v=this.dv.getUint16(this.p,true);this.p+=2;return v}
 s16(){this.bn=0;const v=this.dv.getInt16(this.p,true);this.p+=2;return v}
 u32(){this.bn=0;const v=this.dv.getUint32(this.p,true);this.p+=4;return v}
 ub(n){let v=0;while(n>0){if(this.bn===0){this.bb=this.u[this.p++];this.bn=8}const t=Math.min(n,this.bn);v=v*(1<<t)+((this.bb>>(this.bn-t))&((1<<t)-1));this.bn-=t;n-=t}return v}
 sb(n){if(!n)return 0;const v=this.ub(n);return v>=Math.pow(2,n-1)?v-Math.pow(2,n):v}
 fb(n){return this.sb(n)/65536}
 str(){let s='';while(this.p<this.u.length&&this.u[this.p]!==0)s+=String.fromCharCode(this.u[this.p++]);this.p++;return s}
 rect(){const n=this.ub(5);const a=this.sb(n),b=this.sb(n),c=this.sb(n),d=this.sb(n);this.bn=0;return[a,b,c,d]}
 matrix(){let a=1,d=1,b=0,c=0;if(this.ub(1)){const n=this.ub(5);a=this.fb(n);d=this.fb(n)}
  if(this.ub(1)){const n=this.ub(5);b=this.fb(n);c=this.fb(n)}
  const n=this.ub(5);const tx=this.sb(n),ty=this.sb(n);this.bn=0;return[a,b,c,d,tx,ty]}
 rgb(){return[this.u8(),this.u8(),this.u8(),1]}
 rgba(){const r=this.u8(),g=this.u8(),b=this.u8(),a=this.u8();return[r,g,b,a/255]}
 cx(alpha){const hasAdd=this.ub(1),hasMul=this.ub(1),n=this.ub(4);const k=alpha?4:3;const mul=[256,256,256,256],add=[0,0,0,0];
  if(hasMul)for(let i=0;i<k;i++)mul[i]=this.sb(n);
  if(hasAdd)for(let i=0;i<k;i++)add[i]=this.sb(n);
  this.bn=0;
  if(!hasAdd&&!hasMul)return null;
  return[mul[0]/256,mul[1]/256,mul[2]/256,mul[3]/256,add[0],add[1],add[2],add[3]]}
}
const pm=m=>[m[0],m[1],m[2],m[3],m[4]/20,m[5]/20];
const fq=v=>+(v/20).toFixed(2);
function readTags(raw,start,end){
 const dv=new DataView(raw.buffer,raw.byteOffset,raw.byteLength);const tags=[];let p=start;
 while(p+2<=end){const h=dv.getUint16(p,true);p+=2;const code=h>>6;let len=h&63;
  if(len===63){if(p+4>end)break;len=dv.getUint32(p,true);p+=4}
  if(p+len>end)len=end-p;
  tags.push({code,p,len});p+=len;if(code===0)break}
 return tags;
}
function readFillStyle(b,sh){
 const t=b.u8();
 if(t===0)return{t:'solid',c:sh>=3?b.rgba():b.rgb()};
 if(t===0x10||t===0x12||t===0x13){

  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;

   for(const[cx,cy]of[[b[0],b[1]],[b[2],b[1]],[b[2],b[3]],[b[0],b[3]]]){const x=p.m[0]*cx+p.m[2]*cy+p.m[4],y=p.m[1]*cx+p.m[3]*cy+p.m[5];x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}}

async function decodeBitmap(bm){

   const cv=await bytesToCanvas(data);
   if(bm.alpha&&bm.alpha.length){try{const a=await inflate(bm.alpha);const c=cv.getContext('2d');const id=c.getImageData(0,0,cv.width,cv.height);const n=Math.min(a.length,cv.width*cv.height);for(let i=0;i<n;i++)id.data[i*4+3]=a[i];c.putImageData(id,0,0)}catch(e){}}
   return cv;
  }
  const raw=await inflate(bm.data);const w=bm.w,h=bm.h;const cv=document.createElement('canvas');cv.width=w;cv.height=h;const c=cv.getContext('2d');const id=c.createImageData(w,h);const out=id.data;
  if(bm.fmt===3){const csz=bm.tsz+1,bpc=bm.alpha?4:3;const rb=(w+3)&~3;const base=csz*bpc;
   for(let y=0;y<h;y++)for(let x=0;x<w;x++){const idx=raw[base+y*rb+x];const o=(y*w+x)*4;if(idx<csz){out[o]=raw[idx*bpc];out[o+1]=raw[idx*bpc+1];out[o+2]=raw[idx*bpc+2];out[o+3]=bm.alpha?raw[idx*bpc+3]:255}}}

  else if(bm.fmt===4){const rb=(w*2+3)&~3;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const v=(raw[y*rb+x*2]<<8)|raw[y*rb+x*2+1];const o=(y*w+x)*4;out[o]=((v>>10)&31)*255/31;out[o+1]=((v>>5)&31)*255/31;out[o+2]=(v&31)*255/31;out[o+3]=255}}
  c.putImageData(id,0,0);return cv;
 }catch(e){return null}
}

function bakeTl(it){
 (it._bk||[]).forEach(k=>delete lib[k]);it._bk=[];const center=[doc.w/2,doc.h/2],cache=new Map();let skipped=0;
 const frames=[];
 for(let f=1;f<=it.tl.total;f++){const row=[];let d=1;
  for(let i=it.tl.layers.length-1;i>=0;i--){const L=it.tl.layers[i];if(L.cam||!L.visible||L.mask>0)continue;
   layerObjsRaw(L,f).forEach(o=>{let ch=null;
    if(o.type==='image')ch=o.asset;else if(o.type==='sym')ch=o.lib;
    else if(o.type==='rect'||o.type==='ellipse'||o.type==='path'){const key=JSON.stringify([o.type,o.w,o.h,o.fill,o.stroke,o.sw,o.radius,o.pts]);ch=cache.get(key);

    const a=o.alpha??1;row.push({d:d++,ch,m:itemMatrix(o,center),cx:a<1||o.cx?mulCx(a<1?[1,1,1,a,0,0,0,0]:null,o.cx||null):null,n:0})})}

  it.frames.forEach((fr,fi)=>{const p=fr.find(q=>q.d===d);if(p!==prev){let objs=[];if(p){const o=symObjFrom({ch:p.ch,m:p.m,cx:p.cx},'');o.x+=center[0];o.y+=center[1];objs=[o]}L.frames[fi+1]={objs};prev=p}});

function gifParse(u8){

function itemCanvas(it,scale=2){
 if(it.type==='image'){const im=libImgs[it.id];if(!im)return null;const cv=document.createElement('canvas');cv.width=it.w;cv.height=it.h;cv.getContext('2d').drawImage(im,0,0,it.w,it.h);return cv}
 const b=boundsOf(it);const pad=2;const bw=Math.max(b[2]-b[0],1)+pad*2,bh=Math.max(b[3]-b[1],1)+pad*2;
 const s=Math.min(scale,4096/bw,4096/bh);const cv=document.createElement('canvas');cv.width=Math.max(1,Math.ceil(bw*s));cv.height=Math.max(1,Math.ceil(bh*s));
 const c=cv.getContext('2d');c.scale(s,s);c.translate(-b[0]+pad,-b[1]+pad);
 const old=spriteClock;spriteClock=0;try{drawChar(c,it,null,0)}catch(e){}spriteClock=old;return cv;
}
const toBlob=cv=>new Promise(r=>cv.toBlob(r,'image/png'));
async function downloadLibItem(){
 const it=libSel&&lib[libSel];if(!it)return toast('Selecciona una imagen en la Biblioteca');
 if(it.type==='audio')return dlAudio(it);
 const cv=itemCanvas(it);if(!cv)return toast('Esa imagen aún no está cargada');

}
const crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function makeZip(files){
 const enc=new TextEncoder();const parts=[],cent=[];let off=0,csz=0;
 for(const f of files){
  const nm=enc.encode(f.name),len=f.data.byteLength,crc=crc32(f.data);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);h.setUint32(14,crc,true);h.setUint32(18,len,true);h.setUint32(22,len,true);h.setUint16(26,nm.length,true);
  parts.push(h.buffer,nm,f.data);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,len,true);c.setUint32(24,len,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
  cent.push(c.buffer,nm);csz+=46+nm.length;off+=30+nm.length+len;
 }
 const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csz,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cent,e.buffer],{type:'application/zip'});
}
async function downloadZip(all){

 if(!items.length)return toast(all?'La biblioteca está vacía':'No hay imágenes en la biblioteca (este SWF solo tiene vectores: usa "ZIP todo")');
 const files=[];
 for(let i=0;i<items.length;i++){
  if(i%10===0){busy('Preparando imágenes '+(i+1)+' / '+items.length+'…');await sleep(0)}
  if(items[i].type==='audio'){files.push({name:String(i+1).padStart(3,'0')+'_'+audName(items[i]),data:dataUrlBytes(items[i].dataUrl)});continue}

  const blob=await toBlob(cv);files.push({name:String(i+1).padStart(3,'0')+'_'+safe(items[i].name)+'.png',data:new Uint8Array(await blob.arrayBuffer())});
 }

function play(){

 playing=true;$('#bPlay').textContent='Ⅱ';clock=cur-1;lastT=performance.now();acc=0;soundsFrom(cur-1);requestAnimationFrame(tick);
}
function tick(t){
 if(!playing)return;acc+=t-lastT;lastT=t;const step=1000/Math.max(1,doc.fps);let adv=0;
 while(acc>=step){acc-=step;adv++}
 if(adv){const prevF=cur;clock+=adv;
  clock-=adv;let halt=0,ended=false;const lp=$('#loop').checked;
  for(let i=0;i<adv;i++){clock++;
   if(lp)cur=clock%totalFrames+1;else if(clock>=totalFrames-1){cur=totalFrames;ended=true;break}else cur=clock+1;
   const a=(doc.acts||{})[cur];
   if(a){if(a.op==='stop'){halt=cur;break}if(a.op==='goto'){const to=clamp(a.to,1,totalFrames);clock=to-1;cur=to;if(!a.play){halt=to;break}}}}
  if(ended||halt){cur=halt||totalFrames;play();return}
  soundSync(prevF);
  const px=(cur-1)*CW,sx=tlScroll.scrollLeft;if(px<sx||px>sx+tlScroll.clientWidth-CW)tlScroll.scrollLeft=Math.max(0,px-40);
  drawTimeline();render();
 }
 requestAnimationFrame(tick);
}

const KT={v:'select',q:'free',n:'line',r:'rect',o:'ellipse',b:'brush',t:'text',k:'bucket',i:'eyedrop',e:'eraser',h:'hand',z:'zoom',c:'camera',j:'bone',p:'pose'};
document.addEventListener('keydown',e=>{
 const tg=e.target;if(tg.matches&&tg.matches('input,textarea,select')){if(e.key==='Escape')tg.blur();return}
 const ctrl=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
 if(ctrl){
  if(k==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(k==='y'){e.preventDefault();redo()}
  else if(k==='c'){copy()}else if(k==='x'){e.preventDefault();act('cut')}else if(k==='v'){e.preventDefault();paste()}
  else if(k==='d'){e.preventDefault();act('dup')}else if(k==='s'){e.preventDefault();saveProject()}
  else if(k==='i'){e.preventDefault();act('import')}else if(k==='='||k==='+'){e.preventDefault();act('zin')}else if(k==='-'){e.preventDefault();act('zout')}
  return;
 }
 if(e.key==='F5'){e.preventDefault();act(e.shiftKey?'sf5':'f5')}else if(e.key==='F6'){e.preventDefault();act(e.shiftKey?'sf6':'f6')}else if(e.key==='F7'){e.preventDefault();act('f7')}else if(e.key==='F8'){e.preventDefault();act('tosymbol')}
 else if(e.key==='Enter'){e.preventDefault();play()}else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();del()}
 else if(e.key===','){setFrame(cur-1)}else if(e.key==='.'){setFrame(cur+1)}
 else if(e.key.startsWith('Arrow')&&sel){e.preventDefault();const d=e.shiftKey?10:1;pushSoft('arrow');editSel(o=>{if(e.key==='ArrowLeft')o.x-=d;if(e.key==='ArrowRight')o.x+=d;if(e.key==='ArrowUp')o.y-=d;if(e.key==='ArrowDown')o.y+=d});refreshProps();requestRender()}
 else if(e.key==='Escape'){closeVariants();sel=null;updateAll()}
 else if(KT[k])setTool(KT[k]);
});
